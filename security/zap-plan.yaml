# Plan de OWASP ZAP (Automation Framework) para el pipeline de Jenkins.
# Escaneo DAST autenticado: spider + escaneo pasivo + escaneo activo con el
# usuario de prueba "ana", para alcanzar las páginas protegidas por login.
# URL objetivo: http://securedev-app:8000 (nombre del contenedor en la red devsecops).
# Se escribe literal porque ZAP no reemplaza variables en la verificación de login.
env:
  contexts:
    - name: securedev
      urls:
        - "http://securedev-app:8000"
      includePaths:
        - "http://securedev-app:8000.*"
      excludePaths:
        - "http://securedev-app:8000/logout.*"
        - "http://securedev-app:8000/metrics.*"
      authentication:
        method: form
        parameters:
          loginPageUrl: "http://securedev-app:8000/login"
          loginRequestUrl: "http://securedev-app:8000/login"
          loginRequestBody: "username={%username%}&password={%password%}"
        verification:
          method: poll
          pollUrl: "http://securedev-app:8000/"
          pollFrequency: 60
          pollUnits: requests
          loggedInRegex: "\\QSalir\\E"
          loggedOutRegex: "\\QIngresar\\E"
      sessionManagement:
        method: cookie
      users:
        - name: ana
          credentials:
            username: ana
            password: ana123
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10
  - type: spider
    parameters:
      context: securedev
      user: ana
      url: "http://securedev-app:8000/"
      maxDuration: 2
  - type: passiveScan-wait
    parameters:
      maxDuration: 2
  - type: activeScan
    parameters:
      context: securedev
      user: ana
      maxRuleDurationInMins: 1
      maxScanDurationInMins: 8
  - type: passiveScan-wait
    parameters:
      maxDuration: 2
  - type: report
    parameters:
      template: traditional-html
      reportDir: /home/zap
      reportFile: zap-report.html
      reportTitle: "OWASP ZAP - SecureDev Tickets"
  - type: report
    parameters:
      template: traditional-json
      reportDir: /home/zap
      reportFile: zap-report.json
  - type: report
    parameters:
      template: traditional-md
      reportDir: /home/zap
      reportFile: zap-report.md
