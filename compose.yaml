name: securedev-estudiante

services:
  app:
    build: .
    image: securedev-app:latest
    container_name: securedev-app
    environment:
      DATABASE_PATH: /data/securedev.db
      SECRET_KEY: clave-insegura-solo-laboratorio
    volumes:
      - app_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - devsecops

networks:
  devsecops:
    external: true

volumes:
  app_data:
