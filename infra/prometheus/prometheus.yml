# Prometheus: recolecta las métricas de la aplicación en producción.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: securedev-app
    metrics_path: /metrics
    static_configs:
      - targets: ["securedev-app:8000"]
        labels:
          app: securedev-tickets
          entorno: produccion

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
